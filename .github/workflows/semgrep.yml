name: Semgrep

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Análisis estático de seguridad
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Semgrep
        run: python -m pip install --disable-pip-version-check semgrep
      - name: Analizar código
        run: >-
          semgrep scan
          --config p/owasp-top-ten
          --config p/python
          --config p/javascript
          --metrics=off
          --error
          .
